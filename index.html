<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUPER CAR - Ultra Arcade PWA</title>
  
  <!-- Configurações PWA -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Super Car">
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050a;
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    /* UI Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 5, 12, 0.9);
      backdrop-filter: blur(8px);
      z-index: 10;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.2rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff0055, #ff5500, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
      margin-bottom: 2px;
      letter-spacing: 2px;
      text-align: center;
    }
    .subtitle {
      font-size: 1rem;
      color: #00f0ff;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: #aaa;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    
    /* Grid de Seleção de Fases */
    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 15px;
    }
    @media (max-width: 850px) {
      .tracks-grid { grid-template-columns: repeat(3, 1fr); }
      .title { font-size: 2.2rem; }
    }
    @media (max-width: 550px) {
      .tracks-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .track-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      position: relative;
    }
    .track-card:hover:not(.locked) {
      border-color: #00f0ff;
      transform: translateY(-3px);
      background: rgba(0, 240, 255, 0.1);
    }
    .track-card.active {
      border-color: #ff0055;
      background: rgba(255, 0, 85, 0.2);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }
    .track-card.locked {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }
    .track-icon { font-size: 1.8rem; margin-bottom: 3px; }
    .track-name { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; color: #fff; }

    /* Selection da Garagem */
    .garage-grid {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
    }
    .car-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .car-card:hover {
      border-color: #ffcc00;
      background: rgba(255, 204, 0, 0.1);
    }
    .car-card.active {
      border-color: #ffcc00;
      background: rgba(255, 204, 0, 0.25);
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
    }
    .car-color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    /* Botão Start */
    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      padding: 12px 40px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff0055, #ff5500);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.8);
    }

    /* HUD em jogo */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-box {
      background: rgba(5, 5, 12, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 8px 15px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    .hud-label {
      font-size: 0.7rem;
      color: #00f0ff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hud-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
    }

    /* Nitro Bar */
    .nitro-container {
      width: 180px;
      height: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #00f0ff;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 4px;
    }
    .nitro-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00f0ff, #ff00ff);
      transition: width 0.1s linear;
    }

    .speedometer {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(5, 5, 12, 0.85);
      border: 2px solid #ff0055;
      border-radius: 50%;
      width: 100px;
      height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
    }
    .speed-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      line-height: 0.9;
    }
    .speed-unit { font-size: 0.65rem; color: #ff0055; letter-spacing: 1px; margin-top: 2px; }

    /* Controles de Tela Virtuais (Touch & Click) */
    .touch-controls-left {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .touch-controls-right {
      position: absolute;
      bottom: 20px;
      right: 130px;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      color: white;
      backdrop-filter: blur(4px);
      touch-action: manipulation;
      cursor: pointer;
    }
    .touch-btn:active {
      background: rgba(0, 240, 255, 0.4);
      border-color: #00f0ff;
    }
    .btn-turbo {
      background: rgba(255, 0, 85, 0.3);
      border-color: #ff0055;
      font-weight: bold;
      font-size: 1rem;
      font-family: 'Orbitron', sans-serif;
    }
    .btn-turbo:active {
      background: rgba(255, 0, 85, 0.7);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas"></canvas>

    <!-- UI Overlay / Menus -->
    <div id="menu-overlay" class="overlay">
      <h1 class="title">SUPER CAR</h1>
      <div class="subtitle">Ultimate Racing Experience</div>

      <div class="section-title">Escolha a Pista / Fase</div>
      <div class="tracks-grid" id="tracks-grid"></div>

      <div class="section-title">Garagem / Escolha seu Veículo</div>
      <div class="garage-grid" id="garage-grid"></div>

      <button id="start-btn" class="btn">INICIAR CORRIDA</button>
    </div>

    <!-- HUD em Jogo -->
    <div id="hud" style="display: none;">
      <div class="hud-top">
        <div class="hud-box">
          <div class="hud-label">Tempo</div>
          <div class="hud-value" id="hud-time">60.0</div>
        </div>
        <div class="hud-box" style="text-align: center;">
          <div class="hud-label" id="hud-track-name">FASE</div>
          <div class="hud-value" id="hud-progress" style="color: #00f0ff; font-size: 1.2rem;">0%</div>
          <div class="nitro-container"><div class="nitro-bar" id="nitro-bar"></div></div>
        </div>
        <div class="hud-box" style="text-align: right;">
          <div class="hud-label">Pontos</div>
          <div class="hud-value" id="hud-score">0</div>
        </div>
      </div>

      <div class="speedometer">
        <div class="speed-val" id="hud-speed">0</div>
        <div class="speed-unit">KM/H</div>
      </div>

      <!-- Controles Virtuais na Tela -->
      <div class="touch-controls-left">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <div class="touch-controls-right">
        <div class="touch-btn btn-turbo" id="btn-turbo">⚡</div>
        <div class="touch-btn" id="btn-accel" style="background: rgba(0,255,100,0.25);">▲</div>
        <div class="touch-btn" id="btn-brake" style="background: rgba(255,0,50,0.25);">▼</div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. FASES E CARROS (INCLUINDO FERRARI)
       ========================================================================== */
    const TRACKS = [
      {
        id: 'synthwave', name: 'Synthwave City', icon: '🌃', unlocked: true, length: 1000, timeLimit: 55,
        skyGradient: ['#0d0221', '#260859', '#ff0055'], groundColor: '#0a0a16',
        grassColors: ['#120826', '#1a0b36'], rumbleColors: ['#ff0055', '#00f0ff'],
        roadColor: '#181828', lineColor: '#ffffff'
      },
      {
        id: 'desert', name: 'Blazing Desert', icon: '🏜️', unlocked: false, length: 1200, timeLimit: 50,
        skyGradient: ['#2b0400', '#8c1c03', '#ff7700'], groundColor: '#4a1500',
        grassColors: ['#cc5200', '#b34700'], rumbleColors: ['#ffffff', '#ff3300'],
        roadColor: '#332218', lineColor: '#ffcc00'
      },
      {
        id: 'snow', name: 'Snow Aurora', icon: '🏔️', unlocked: false, length: 1300, timeLimit: 48,
        skyGradient: ['#021029', '#0b355c', '#00ffcc'], groundColor: '#dbeeff',
        grassColors: ['#a6d2ed', '#8cbcdb'], rumbleColors: ['#0088ff', '#ffffff'],
        roadColor: '#2c3540', lineColor: '#ffffff'
      },
      {
        id: 'tropical', name: 'Tropical Sunset', icon: '🌅', unlocked: false, length: 1400, timeLimit: 45,
        skyGradient: ['#1c002b', '#7b0051', '#ff5500', '#ffcc00'], groundColor: '#2b1a09',
        grassColors: ['#0d5e3a', '#08472b'], rumbleColors: ['#ffcc00', '#ffffff'],
        roadColor: '#242424', lineColor: '#ffffff'
      },
      {
        id: 'cyber', name: 'Cyber Highway', icon: '⚡', unlocked: false, length: 1500, timeLimit: 42,
        skyGradient: ['#000000', '#051923', '#006466'], groundColor: '#020b14',
        grassColors: ['#003554', '#051923'], rumbleColors: ['#00ffcc', '#ff00ff'],
        roadColor: '#0a1118', lineColor: '#00ffcc'
      }
    ];

    const CARS = [
      { id: 'ferrari', name: 'Ferrari F8', color: '#ff0000', maxSpeed: 360, accel: 0.35, handling: 0.0038 },
      { id: 'lambo', name: 'Lambo Aventador', color: '#ffe600', maxSpeed: 350, accel: 0.32, handling: 0.0036 },
      { id: 'porsche', name: 'Porsche 911', color: '#00f0ff', maxSpeed: 330, accel: 0.28, handling: 0.0034 },
      { id: 'mclaren', name: 'McLaren P1', color: '#ff5500', maxSpeed: 340, accel: 0.30, handling: 0.0035 },
      { id: 'bugatti', name: 'Bugatti Chiron', color: '#0055ff', maxSpeed: 380, accel: 0.38, handling: 0.0040 }
    ];

    /* ==========================================================================
       2. GERADOR DE SENSÇÃO DE ÁUDIO
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.engineOsc = null;
        this.engineGain = null;
      }
      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          return;
        }
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.engineOsc = this.ctx.createOscillator();
          this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth';
          this.engineOsc.frequency.setValueAtTime(40, this.ctx.currentTime);
          this.engineGain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          this.engineOsc.connect(this.engineGain);
          this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();
        } catch (e) {}
      }
      updateEngine(ratio) {
        if (!this.ctx || !this.engineOsc) return;
        const freq = 40 + ratio * 160;
        this.engineOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.08);
      }
      playCoin() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch(e) {}
      }
      playCrash() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(90, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.2);
        } catch(e) {}
      }
    }

    const audio = new SoundEngine();

    /* ==========================================================================
       3. ESTRUTURA E FÍSICA DO JOGO
       ========================================================================== */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let selectedTrack = TRACKS[0];
    let selectedCar = CARS[0];
    let isPlaying = false;
    let score = 0;
    let timeRemaining = 0;
    let nitroAmount = 100;

    let position = 0;
    let speed = 0;
    let playerX = 0;
    const segmentLength = 200;
    const cameraDepth = 0.84;
    const roadWidth = 2000;
    const drawDistance = 60;

    let segments = [];
    let carsTraffic = [];
    const keys = { left: false, right: false, accel: false, brake: false, turbo: false };

    function loadSavedProgress() {
      try {
        const saved = localStorage.getItem('super_car_unlocked');
        if (saved) {
          const unlockedIds = JSON.parse(saved);
          TRACKS.forEach(t => {
            if (unlockedIds.includes(t.id)) t.unlocked = true;
          });
        }
      } catch(e) {}
    }

    function saveProgress() {
      try {
        const unlockedIds = TRACKS.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('super_car_unlocked', JSON.stringify(unlockedIds));
      } catch(e) {}
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function buildTrack(trackConfig) {
      segments = [];
      const numSegments = trackConfig.length;

      for (let i = 0; i < numSegments; i++) {
        let curve = 0;
        if (i > 80 && i < 220) curve = 2;
        if (i > 300 && i < 480) curve = -3;
        if (i > 550 && i < 750) curve = 3.5;
        if (i > 850 && i < 1100) curve = -2;

        let sprite = null;
        if (i % 25 === 0) {
          sprite = { type: 'coin', offset: (Math.random() - 0.5) * 1.2 };
        } else if (i % 20 === 0) {
          sprite = { type: 'scenery', offset: Math.random() > 0.5 ? 1.6 : -1.6 };
        }

        segments.push({
          index: i,
          p1: { camera: {}, screen: {} },
          p2: { camera: {}, screen: {} },
          curve: curve,
          color: Math.floor(i / 3) % 2 === 0 ? 'dark' : 'light',
          sprite: sprite
        });
      }

      carsTraffic = [];
      for (let i = 0; i < numSegments / 35; i++) {
        carsTraffic.push({
          offset: (Math.random() - 0.5) * 1.3,
          z: Math.random() * numSegments * segmentLength,
          speed: 90 + Math.random() * 70,
          color: ['#00ff66', '#ff00ff', '#ffff00', '#ffffff'][Math.floor(Math.random() * 4)]
        });
      }
    }

    function project(p, cameraX, cameraY, cameraZ, width, height) {
      p.camera.x = -cameraX;
      p.camera.y = -cameraY;
      p.camera.z = cameraZ;
      p.screen.scale = cameraDepth / Math.max(1, cameraZ);
      p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
      p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
      p.screen.w = Math.round(p.screen.scale * roadWidth * width / 2);
    }

    /* ==========================================================================
       4. LOOP PRINCIPAL
       ========================================================================== */
    let lastTime = performance.now();

    function update(dt) {
      if (!isPlaying) return;

      timeRemaining -= dt;
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        gameOver(false);
        return;
      }

      // Cálculo de Nitro
      let maxSpeedAllowed = selectedCar.maxSpeed;
      let accelMultiplier = 1;

      if (keys.turbo && nitroAmount > 0) {
        maxSpeedAllowed += 80;
        accelMultiplier = 2.0;
        nitroAmount = Math.max(0, nitroAmount - 40 * dt);
      } else {
        nitroAmount = Math.min(100, nitroAmount + 5 * dt);
      }

      // Aceleração e Frenagem
      if (keys.accel) {
        speed += selectedCar.accel * 400 * accelMultiplier;
      } else if (keys.brake) {
        speed -= selectedCar.accel * 600;
      } else {
        speed -= 40;
      }

      speed = Math.max(0, Math.min(speed, maxSpeedAllowed));

      const currentSegmentIndex = Math.floor(position / segmentLength) % segments.length;
      const currentSegment = segments[currentSegmentIndex];
      const speedRatio = speed / maxSpeedAllowed;

      if (keys.left) playerX -= selectedCar.handling * speedRatio * 1400;
      if (keys.right) playerX += selectedCar.handling * speedRatio * 1400;

      playerX -= (currentSegment.curve * 0.00025 * speedRatio);
      playerX = Math.max(-1.8, Math.min(1.8, playerX));

      if (Math.abs(playerX) > 1.1 && speed > 80) {
        speed -= 160 * dt;
      }

      position += speed * 15 * dt;
      const trackTotalLength = segments.length * segmentLength;

      if (position >= trackTotalLength) {
        gameOver(true);
        return;
      }

      audio.updateEngine(speedRatio);

      // Moedas
      if (currentSegment.sprite && currentSegment.sprite.type === 'coin') {
        if (Math.abs(playerX - currentSegment.sprite.offset) < 0.45) {
          score += 250;
          nitroAmount = Math.min(100, nitroAmount + 25);
          audio.playCoin();
          currentSegment.sprite = null;
        }
      }

      // Tráfego NPC
      for (let i = 0; i < carsTraffic.length; i++) {
        const npc = carsTraffic[i];
        npc.z += npc.speed * 10 * dt;
        if (npc.z > trackTotalLength) npc.z -= trackTotalLength;

        if (Math.abs(position - npc.z) < 110 && Math.abs(playerX - npc.offset) < 0.35) {
          speed = 40;
          audio.playCrash();
        }
      }

      // Atualizar HUD
      document.getElementById('hud-speed').innerText = Math.round(speed);
      document.getElementById('hud-time').innerText = timeRemaining.toFixed(1);
      document.getElementById('hud-score').innerText = score;
      document.getElementById('hud-progress').innerText = Math.round((position / trackTotalLength) * 100) + '%';
      document.getElementById('nitro-bar').style.width = nitroAmount + '%';
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;

      // Céu
      const skyHeight = h * 0.45;
      const skyGrad = ctx.createLinearGradient(0, 0, 0, skyHeight);
      skyGrad.addColorStop(0, selectedTrack.skyGradient[0]);
      skyGrad.addColorStop(1, selectedTrack.skyGradient[selectedTrack.skyGradient.length - 1]);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, skyHeight);

      // Chão
      ctx.fillStyle = selectedTrack.groundColor;
      ctx.fillRect(0, skyHeight, w, h - skyHeight);

      // Pista
      const baseIndex = Math.floor(position / segmentLength) % segments.length;
      let dx = 0;
      const camHeight = 1000;

      for (let n = 0; n < drawDistance; n++) {
        const seg = segments[(baseIndex + n) % segments.length];
        const looped = seg.index < baseIndex;
        const cameraZ = (position - (looped ? segments.length * segmentLength : 0)) - (seg.index * segmentLength);
        const absCameraZ = Math.abs(cameraZ);

        project(seg.p1, playerX * roadWidth - dx, camHeight, absCameraZ, w, h);
        project(seg.p2, playerX * roadWidth - dx - seg.curve, camHeight, absCameraZ + segmentLength, w, h);

        dx += seg.curve;

        if (seg.p1.screen.y <= seg.p2.screen.y) continue;

        const isDark = seg.color === 'dark';
        const grassColor = isDark ? selectedTrack.grassColors[0] : selectedTrack.grassColors[1];
        const rumbleColor = isDark ? selectedTrack.rumbleColors[0] : selectedTrack.rumbleColors[1];

        // Grama
        ctx.fillStyle = grassColor;
        ctx.fillRect(0, seg.p2.screen.y, w, seg.p1.screen.y - seg.p2.screen.y);

        // Zebra
        const r1 = seg.p1.screen.w * 0.15;
        const r2 = seg.p2.screen.w * 0.15;
        ctx.fillStyle = rumbleColor;
        drawPoly(seg.p1.screen.x - seg.p1.screen.w - r1, seg.p1.screen.y, seg.p1.screen.x - seg.p1.screen.w, seg.p1.screen.y, seg.p2.screen.x - seg.p2.screen.w, seg.p2.screen.y, seg.p2.screen.x - seg.p2.screen.w - r2, seg.p2.screen.y);
        drawPoly(seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y, seg.p1.screen.x + seg.p1.screen.w + r1, seg.p1.screen.y, seg.p2.screen.x + seg.p2.screen.w + r2, seg.p2.screen.y, seg.p2.screen.x + seg.p2.screen.w, seg.p2.screen.y);

        // Pista
        ctx.fillStyle = selectedTrack.roadColor;
        drawPoly(seg.p1.screen.x - seg.p1.screen.w, seg.p1.screen.y, seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y, seg.p2.screen.x + seg.p2.screen.w, seg.p2.screen.y, seg.p2.screen.x - seg.p2.screen.w, seg.p2.screen.y);

        // Faixa Central
        if (isDark) {
          ctx.fillStyle = selectedTrack.lineColor;
          const lw1 = seg.p1.screen.w * 0.03;
          const lw2 = seg.p2.screen.w * 0.03;
          drawPoly(seg.p1.screen.x - lw1, seg.p1.screen.y, seg.p1.screen.x + lw1, seg.p1.screen.y, seg.p2.screen.x + lw2, seg.p2.screen.y, seg.p2.screen.x - lw2, seg.p2.screen.y);
        }

        // Elementos Laterais / Moedas
        if (seg.sprite) {
          const sx = seg.p1.screen.x + seg.p1.screen.scale * seg.sprite.offset * roadWidth * w / 2;
          const sy = seg.p1.screen.y;
          const size = seg.p1.screen.scale * 1200;

          if (seg.sprite.type === 'coin') {
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(sx, sy - size * 0.3, Math.max(3, size * 0.18), 0, Math.PI * 2);
            ctx.fill();
          } else if (seg.sprite.type === 'scenery') {
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(sx - size * 0.1, sy - size, size * 0.2, size);
          }
        }
      }

      // Carro do Jogador
      drawPlayerCar(w / 2, h - 70, selectedCar.color);
    }

    function drawPoly(x1, y1, x2, y2, x3, y3, x4, y4) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.lineTo(x4, y4);
      ctx.closePath();
      ctx.fill();
    }

    function drawPlayerCar(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x - 50, y - 30, 100, 30);
      
      ctx.fillStyle = '#111';
      ctx.fillRect(x - 35, y - 50, 70, 22);
      
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(x - 44, y - 26, 20, 6);
      ctx.fillRect(x + 24, y - 26, 20, 6);

      ctx.fillStyle = '#000';
      ctx.fillRect(x - 56, y - 18, 10, 18);
      ctx.fillRect(x + 46, y - 18, 10, 18);
    }

    function gameLoop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    /* ==========================================================================
       5. INTERFACE & EVENTOS DE CONTROLE
       ========================================================================== */
    function initUI() {
      const tracksGrid = document.getElementById('tracks-grid');
      tracksGrid.innerHTML = '';
      TRACKS.forEach(track => {
        const card = document.createElement('div');
        card.className = `track-card ${track.unlocked ? '' : 'locked'} ${track.id === selectedTrack.id ? 'active' : ''}`;
        card.innerHTML = `
          <div class="track-icon">${track.icon}</div>
          <div class="track-name">${track.name}</div>
        `;
        card.onclick = () => {
          if (!track.unlocked) return;
          selectedTrack = track;
          document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };
        tracksGrid.appendChild(card);
      });

      const garageGrid = document.getElementById('garage-grid');
      garageGrid.innerHTML = '';
      CARS.forEach(car => {
        const card = document.createElement('div');
        card.className = `car-card ${car.id === selectedCar.id ? 'active' : ''}`;
        card.innerHTML = `
          <div class="car-color-dot" style="background:${car.color};"></div>
          <div style="font-family:'Orbitron'; font-size:0.85rem;">${car.name}</div>
        `;
        card.onclick = () => {
          selectedCar = car;
          document.querySelectorAll('.car-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };
        garageGrid.appendChild(card);
      });
    }

    function startGame() {
      audio.init();
      buildTrack(selectedTrack);
      
      position = 0;
      speed = 0;
      playerX = 0;
      score = 0;
      nitroAmount = 100;
      timeRemaining = selectedTrack.timeLimit;
      isPlaying = true;

      document.getElementById('menu-overlay').classList.add('hidden');
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('hud-track-name').innerText = selectedTrack.name;
    }

    function gameOver(isWin) {
      isPlaying = false;
      document.getElementById('hud').style.display = 'none';
      document.getElementById('menu-overlay').classList.remove('hidden');

      if (isWin) {
        const currentIndex = TRACKS.findIndex(t => t.id === selectedTrack.id);
        if (currentIndex < TRACKS.length - 1) {
          TRACKS[currentIndex + 1].unlocked = true;
          saveProgress();
        }
        alert(`🏆 VITÓRIA! Fase Concluída!\nPontuação: ${score}`);
      } else {
        alert('💥 TEMPO ESGOTADO!');
      }

      initUI();
    }

    document.getElementById('start-btn').onclick = startGame;

    // Teclado
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w') keys.accel = true;
      if (e.key === 'ArrowDown' || e.key === 's') keys.brake = true;
      if (e.key === ' ' || e.key === 'Shift') keys.turbo = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w') keys.accel = false;
      if (e.key === 'ArrowDown' || e.key === 's') keys.brake = false;
      if (e.key === ' ' || e.key === 'Shift') keys.turbo = false;
    });

    // Eventos de Touch/Clique nos Botões da Tela
    const bindControl = (id, key) => {
      const btn = document.getElementById(id);
      
      const press = (e) => { e.preventDefault(); keys[key] = true; };
      const release = (e) => { e.preventDefault(); keys[key] = false; };

      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
    };

    bindControl('btn-left', 'left');
    bindControl('btn-right', 'right');
    bindControl('btn-accel', 'accel');
    bindControl('btn-brake', 'brake');
    bindControl('btn-turbo', 'turbo');

    // Inicialização
    loadSavedProgress();
    initUI();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
