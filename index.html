<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUPER F1 - 100 Fases & Áudio</title>
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050a;
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 5, 12, 0.95);
      z-index: 10;
      transition: opacity 0.3s ease;
      padding: 20px;
      overflow-y: auto;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffcc00, #ff5500, #ff0055);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 2px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #00f0ff;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    
    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 850px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 12px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
    }
    @media (max-width: 850px) {
      .tracks-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 550px) {
      .tracks-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .track-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px;
      cursor: pointer;
      text-align: center;
      position: relative;
    }
    .track-card.active {
      border-color: #ffcc00;
      background: rgba(255, 204, 0, 0.2);
    }
    .track-card.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .track-icon { font-size: 1.2rem; }
    .track-name { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; color: #fff; margin-top: 2px; }

    .garage-grid {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 850px;
    }
    .car-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .car-card.active {
      border-color: #ff0055;
      background: rgba(255, 0, 85, 0.2);
    }
    .car-color-dot { width: 12px; height: 12px; border-radius: 50%; }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 12px 35px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff0055, #ff5500);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .hud-box {
      background: rgba(5, 5, 12, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
    }
    .hud-top-buttons {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .hud-action-btn {
      background: rgba(5, 5, 12, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 6px;
      padding: 6px 12px;
      color: #00f0ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .hud-action-btn:active {
      background: rgba(0, 240, 255, 0.3);
    }
    
    .hud-label { font-size: 0.65rem; color: #00f0ff; letter-spacing: 1px; text-transform: uppercase; }
    .hud-value { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 900; color: #fff; }

    .nitro-container {
      width: 100px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #00f0ff;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 3px;
    }
    .nitro-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #00f0ff, #ff00ff); }

    .speedometer {
      position: absolute;
      top: 75px;
      right: 15px;
      background: rgba(5, 5, 12, 0.85);
      border: 2px solid #ffcc00;
      border-radius: 50%;
      width: 75px;
      height: 75px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
    }
    .speed-val { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; color: #fff; line-height: 0.9; }
    .speed-unit { font-size: 0.5rem; color: #ffcc00; letter-spacing: 1px; margin-top: 2px; }

    /* CONTROLES ELEVADOS PARA MELHOR ERGONOMIA */
    .touch-controls-left {
      position: absolute;
      bottom: 95px;
      left: 20px;
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }
    .touch-controls-right {
      position: absolute;
      bottom: 95px;
      right: 20px;
      display: flex;
      gap: 12px;
      pointer-events: auto;
      align-items: flex-end;
    }
    .touch-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      border: 3px solid rgba(255, 255, 255, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      color: white;
      touch-action: manipulation;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .touch-btn:active, .touch-btn.pressed {
      background: rgba(255, 204, 0, 0.5);
      border-color: #ffcc00;
      transform: scale(0.95);
    }
    .btn-turbo {
      width: 62px;
      height: 62px;
      background: rgba(255, 0, 85, 0.4);
      border-color: #ff0055;
      font-size: 1rem;
      font-family: 'Orbitron', sans-serif;
    }
    .pedals-group {
      display: flex;
      gap: 12px;
    }
    
    #result-modal { text-align: center; }
    #result-title { font-family: 'Orbitron', sans-serif; font-size: 2rem; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="menu-overlay" class="overlay">
      <h1 class="title">SUPER F1 GRAND PRIX</h1>
      <div class="subtitle">100 Fases • Tráfego F1 Real • Áudio Completo</div>

      <div class="section-title">Selecionar Fase (1 a 100)</div>
      <div class="tracks-grid" id="tracks-grid"></div>

      <div class="section-title">Equipes de F1</div>
      <div class="garage-grid" id="garage-grid"></div>

      <button id="start-btn" class="btn">INICIAR CORRIDA</button>
    </div>

    <div id="result-overlay" class="overlay hidden">
      <div id="result-modal">
        <h2 id="result-title"></h2>
        <p id="result-desc" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
        <button id="result-btn" class="btn">PRÓXIMA FASE</button>
      </div>
    </div>

    <div id="hud" style="display: none;">
      <div class="hud-top">
        <div class="hud-box">
          <div class="hud-label">Tempo</div>
          <div class="hud-value" id="hud-time">60.0</div>
        </div>

        <div class="hud-box" style="text-align: center;">
          <div class="hud-label" id="hud-track-name">FASE 1</div>
          <div class="hud-value" id="hud-progress" style="color: #00f0ff; font-size: 1rem;">0%</div>
          <div class="nitro-container"><div class="nitro-bar" id="nitro-bar"></div></div>
        </div>

        <!-- BOTÕES SUPERIORES: MÚSICA E CÂMERA -->
        <div class="hud-top-buttons">
          <button class="hud-action-btn" id="btn-audio-top">🎵 MÚSICA</button>
          <button class="hud-action-btn" id="btn-cam-top">📹 CÂMERA</button>
        </div>
      </div>

      <div class="speedometer">
        <div class="speed-val" id="hud-speed">0</div>
        <div class="speed-unit">KM/H</div>
      </div>

      <!-- CONTROLES TOUCH MAIS ALTOS PARA MELHOR JOGABILIDADE -->
      <div class="touch-controls-left">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>

      <div class="touch-controls-right">
        <div class="touch-btn btn-turbo" id="btn-turbo">⚡</div>
        <div class="pedals-group">
          <div class="touch-btn" id="btn-brake" style="background: rgba(255,0,50,0.3); border-color: #ff3333;">▼</div>
          <div class="touch-btn" id="btn-accel" style="background: rgba(0,255,100,0.3); border-color: #00ff66;">▲</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 100 Fases Geradas
    const TRACKS = [];
    const themes = [
      { name: 'Monaco GP', sky: ['#0d0221', '#00f0ff'], ground: '#0a0a16', grass: ['#120826', '#1a0b36'], rumble: ['#ff0055', '#00f0ff'], road: '#181828' },
      { name: 'Monza Speed', sky: ['#2b0400', '#ff7700'], ground: '#4a1500', grass: ['#0f380f', '#072007'], rumble: ['#fff', '#ff3300'], road: '#222222' },
      { name: 'Spa Francorchamps', sky: ['#021029', '#00ffcc'], ground: '#102010', grass: ['#1a4a1a', '#0f300f'], rumble: ['#ffcc00', '#fff'], road: '#2c3540' },
      { name: 'Silverstone Grid', sky: ['#0a0a1a', '#aa00ff'], ground: '#020b14', grass: ['#003554', '#051923'], rumble: ['#00ffcc', '#ff00ff'], road: '#11111d' }
    ];

    for (let i = 1; i <= 100; i++) {
      const theme = themes[(i - 1) % themes.length];
      TRACKS.push({
        id: `stage_${i}`,
        name: `Fase ${i} - ${theme.name}`,
        icon: i === 1 ? '🏁' : (i % 5 === 0 ? '🏆' : '🏎️'),
        unlocked: i === 1,
        length: 800 + (i * 45),
        timeLimit: Math.max(35, 65 - Math.floor(i / 3)),
        skyGradient: theme.sky,
        groundColor: theme.ground,
        grassColors: theme.grass,
        rumbleColors: theme.rumble,
        roadColor: theme.road
      });
    }

    const CARS = [
      { id: 'redbull', name: 'Red Bull F1', color: '#061339', accent: '#f50000', maxSpeed: 385, accel: 0.42 },
      { id: 'ferrari', name: 'Scuderia Ferrari', color: '#e80000', accent: '#ffe600', maxSpeed: 382, accel: 0.40 },
      { id: 'mercedes', name: 'Mercedes AMG', color: '#00a39e', accent: '#000000', maxSpeed: 380, accel: 0.39 },
      { id: 'mclaren', name: 'McLaren F1', color: '#ff8000', accent: '#111111', maxSpeed: 378, accel: 0.38 },
      { id: 'aston', name: 'Aston Martin F1', color: '#00594f', accent: '#cedc00', maxSpeed: 376, accel: 0.37 },
      { id: 'alpine', name: 'Alpine F1', color: '#0055a5', accent: '#ff82b2', maxSpeed: 374, accel: 0.36 }
    ];

    // SINTETIZADOR DE ÁUDIO REALISTA PARA MOTOR E MÚSICA SYNTHWAVE
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.engineOsc = null;
        this.engineGain = null;
        this.musicPlaying = true;
        this.musicTimer = null;
        this.step = 0;
      }
      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          return;
        }
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          
          // Sintetizador do motor
          this.engineOsc = this.ctx.createOscillator();
          this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth';
          this.engineOsc.frequency.setValueAtTime(60, this.ctx.currentTime);
          this.engineGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
          
          this.engineOsc.connect(this.engineGain);
          this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();

          this.startMusicSequence();
        } catch(e) {}
      }
      updateEngine(speed, maxSpeed, isAccel) {
        if (!this.ctx || !this.engineOsc) return;
        const ratio = speed / maxSpeed;
        const baseFreq = 60 + (ratio * 260) + (isAccel ? (Math.random() * 10) : 0);
        this.engineOsc.frequency.setTargetAtTime(baseFreq, this.ctx.currentTime, 0.05);
        this.engineGain.gain.setTargetAtTime(speed > 5 ? 0.12 : 0.02, this.ctx.currentTime, 0.05);
      }
      playCrash() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(120, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      }
      toggleMusic() {
        this.musicPlaying = !this.musicPlaying;
        return this.musicPlaying;
      }
      startMusicSequence() {
        const notes = [110, 110, 146, 110, 164, 110, 146, 130];
        setInterval(() => {
          if (!this.musicPlaying || !this.ctx) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const freq = notes[this.step % notes.length];
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.15);
            this.step++;
          } catch(e) {}
        }, 160);
      }
    }

    const audio = new SoundEngine();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let selectedTrack = TRACKS[0];
    let selectedCar = CARS[0];
    let isPlaying = false;
    let timeRemaining = 0;
    let nitroAmount = 100;
    let cameraMode = 0; // 0: Traseira, 1: Cockpit, 2: Alta

    let position = 0;
    let speed = 0;
    let playerX = 0; 
    const segmentLength = 200;
    const roadWidth = 2000;
    const drawDistance = 50;

    let segments = [];
    let traffic = [];
    const keys = { left: false, right: false, accel: false, brake: false, turbo: false };

    function loadSavedProgress() {
      try {
        const saved = localStorage.getItem('f1_unlocked_stage');
        if (saved) {
          const unlockedIds = JSON.parse(saved);
          TRACKS.forEach(t => { if (unlockedIds.includes(t.id)) t.unlocked = true; });
        }
      } catch(e) {}
    }
    function saveProgress() {
      try {
        const unlockedIds = TRACKS.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('f1_unlocked_stage', JSON.stringify(unlockedIds));
      } catch(e) {}
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function buildTrack(trackConfig) {
      segments = [];
      traffic = [];
      const numSegments = trackConfig.length;

      for (let i = 0; i < numSegments; i++) {
        let curve = 0;
        if (i > 30 && i < 110) curve = 2.0;
        if (i > 160 && i < 260) curve = -2.5;
        if (i > 320 && i < 450) curve = 3.0;

        segments.push({
          index: i,
          p1: { camera: {}, screen: {} },
          p2: { camera: {}, screen: {} },
          curve: curve,
          color: Math.floor(i / 3) % 2 === 0 ? 'dark' : 'light'
        });

        // Gerar tráfego real de F1 na pista
        if (i > 50 && i % 18 === 0) {
          traffic.push({
            segmentIndex: i,
            offset: (Math.random() - 0.5) * 1.3,
            speed: 120 + Math.random() * 120,
            car: CARS[Math.floor(Math.random() * CARS.length)]
          });
        }
      }
    }

    function project(p, cameraX, cameraY, cameraZ, width, height) {
      const depth = cameraMode === 2 ? 0.6 : 0.84;
      p.camera.x = -cameraX;
      p.camera.y = -cameraY;
      p.camera.z = cameraZ;
      p.screen.scale = depth / Math.max(1, cameraZ);
      p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
      p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
      p.screen.w = Math.round(p.screen.scale * roadWidth * width / 2);
    }

    let lastTime = performance.now();

    function update(dt) {
      if (!isPlaying) return;

      timeRemaining -= dt;
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        gameOver(false);
        return;
      }

      let maxSpeedAllowed = selectedCar.maxSpeed;
      let accelMultiplier = 1;

      if (keys.turbo && nitroAmount > 0) {
        maxSpeedAllowed += 70;
        accelMultiplier = 1.8;
        nitroAmount = Math.max(0, nitroAmount - 30 * dt);
      } else {
        nitroAmount = Math.min(100, nitroAmount + 5 * dt);
      }

      if (keys.accel) speed += selectedCar.accel * 380 * accelMultiplier;
      else if (keys.brake) speed -= selectedCar.accel * 500;
      else speed -= 40;

      speed = Math.max(0, Math.min(speed, maxSpeedAllowed));
      audio.updateEngine(speed, maxSpeedAllowed, keys.accel);

      if (keys.left) playerX -= 2.2 * dt;
      if (keys.right) playerX += 2.2 * dt;
      playerX = Math.max(-0.85, Math.min(0.85, playerX));

      position += speed * 14 * dt;
      const trackTotalLength = segments.length * segmentLength;

      if (position >= trackTotalLength) {
        gameOver(true);
        return;
      }

      // Atualizar e Verificar Colisões com Tráfego F1
      const currentSeg = Math.floor(position / segmentLength) % segments.length;
      traffic.forEach(t => {
        t.segmentIndex = (t.segmentIndex + (t.speed * dt * 0.05)) % segments.length;
        if (Math.abs(t.segmentIndex - currentSeg) < 1.2 && Math.abs(playerX - t.offset) < 0.35) {
          speed = Math.max(40, speed * 0.4); // Desaceleração com colisão
          audio.playCrash();
        }
      });

      document.getElementById('hud-speed').innerText = Math.round(speed);
      document.getElementById('hud-time').innerText = timeRemaining.toFixed(1);
      document.getElementById('hud-progress').innerText = Math.round((position / trackTotalLength) * 100) + '%';
      document.getElementById('nitro-bar').style.width = nitroAmount + '%';
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;

      const skyHeight = h * (cameraMode === 2 ? 0.35 : 0.45);
      const skyGrad = ctx.createLinearGradient(0, 0, 0, skyHeight);
      skyGrad.addColorStop(0, selectedTrack.skyGradient[0]);
      skyGrad.addColorStop(1, selectedTrack.skyGradient[selectedTrack.skyGradient.length - 1]);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, skyHeight);

      ctx.fillStyle = selectedTrack.groundColor;
      ctx.fillRect(0, skyHeight, w, h - skyHeight);

      const baseIndex = Math.floor(position / segmentLength) % segments.length;
      let dx = 0;
      const camHeight = cameraMode === 2 ? 1600 : (cameraMode === 1 ? 750 : 1000);
      const trackTotalLength = segments.length * segmentLength;

      for (let n = 0; n < drawDistance; n++) {
        const seg = segments[(baseIndex + n) % segments.length];
        const looped = seg.index < baseIndex;
        const cameraZ = (position - (looped ? trackTotalLength : 0)) - (seg.index * segmentLength);
        const absCameraZ = Math.abs(cameraZ);

        project(seg.p1, playerX * roadWidth - dx, camHeight, absCameraZ, w, h);
        project(seg.p2, playerX * roadWidth - dx - seg.curve, camHeight, absCameraZ + segmentLength, w, h);

        dx += seg.curve;

        if (seg.p1.screen.y <= seg.p2.screen.y) continue;

        const isDark = seg.color === 'dark';
        ctx.fillStyle = isDark ? selectedTrack.grassColors[0] : selectedTrack.grassColors[1];
        ctx.fillRect(0, seg.p2.screen.y, w, seg.p1.screen.y - seg.p2.screen.y);

        const r1 = seg.p1.screen.w * 0.15;
        const r2 = seg.p2.screen.w * 0.15;
        ctx.fillStyle = isDark ? selectedTrack.rumbleColors[0] : selectedTrack.rumbleColors[1];
        drawPoly(seg.p1.screen.x - seg.p1.screen.w - r1, seg.p1.screen.y, seg.p1.screen.x - seg.p1.screen.w, seg.p1.screen.y, seg.p2.screen.x - seg.p2.screen.w, seg.p2.screen.y, seg.p2.screen.x - seg.p2.screen.w - r2, seg.p2.screen.y);
        drawPoly(seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y, seg.p1.screen.x + seg.p1.screen.w + r1, seg.p1.screen.y, seg.p2.screen.x + seg.p2.screen.w + r2, seg.p2.screen.y, seg.p2.screen.x + seg.p2.screen.w, seg.p2.screen.y);

        ctx.fillStyle = selectedTrack.roadColor;
        drawPoly(seg.p1.screen.x - seg.p1.screen.w, seg.p1.screen.y, seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y, seg.p2.screen.x + seg.p2.screen.w, seg.p2.screen.y, seg.p2.screen.x - seg.p2.screen.w, seg.p2.screen.y);

        // Renderizar Tráfego de F1
        traffic.forEach(t => {
          if (Math.floor(t.segmentIndex) === seg.index) {
            const tx = seg.p1.screen.x + seg.p1.screen.scale * t.offset * roadWidth * w / 2;
            const ty = seg.p1.screen.y;
            const tScale = seg.p1.screen.scale * 1000;
            drawFormula1Car(tx, ty, t.car.color, t.car.accent, tScale);
          }
        });
      }

      // Renderizar Veículo do Jogador de acordo com a Câmera
      if (cameraMode === 0 || cameraMode === 2) {
        drawFormula1Car(w / 2, h - 70, selectedCar.color, selectedCar.accent, 1);
      } else if (cameraMode === 1) {
        drawCockpitView(w, h);
      }
    }

    function drawPoly(x1, y1, x2, y2, x3, y3, x4, y4) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.lineTo(x4, y4);
      ctx.closePath();
      ctx.fill();
    }

    function drawFormula1Car(x, y, color, accent, scale = 1) {
      const w = 80 * scale;
      const h = 40 * scale;
      ctx.fillStyle = '#111';
      ctx.fillRect(x - w / 2, y - h, w, h * 0.2);
      ctx.fillStyle = color;
      ctx.fillRect(x - w * 0.3, y - h * 0.8, w * 0.6, h * 0.7);
      ctx.fillStyle = accent;
      ctx.fillRect(x - w * 0.4, y - h * 0.3, w * 0.8, h * 0.2);
    }

    function drawCockpitView(w, h) {
      // Visão Interna do Cockpit de F1
      ctx.fillStyle = '#0a0a0d';
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(w * 0.25, h * 0.65);
      ctx.lineTo(w * 0.75, h * 0.65);
      ctx.lineTo(w, h);
      ctx.fill();

      // Volante com Display Digital
      ctx.fillStyle = '#181820';
      ctx.beginPath();
      ctx.arc(w / 2, h - 40, 110, Math.PI, Math.PI * 2);
      ctx.fill();

      // Tela do Volante
      ctx.fillStyle = '#002b36';
      ctx.fillRect(w / 2 - 40, h - 110, 80, 45);
      ctx.fillStyle = '#00f0ff';
      ctx.font = '14px Orbitron';
      ctx.fillText(`${Math.round(speed)} KM/H`, w / 2 - 32, h - 82);
    }

    function gameLoop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;

      if (isPlaying) {
        update(dt);
        render();
      }

      requestAnimationFrame(gameLoop);
    }

    function initUI() {
      const tracksGrid = document.getElementById('tracks-grid');
      tracksGrid.innerHTML = '';
      TRACKS.forEach(track => {
        const card = document.createElement('div');
        card.className = `track-card ${track.id === selectedTrack.id ? 'active' : ''} ${!track.unlocked ? 'locked' : ''}`;
        card.innerHTML = `<div class="track-icon">${track.unlocked ? track.icon : '🔒'}</div><div class="track-name">${track.name}</div>`;
        card.onclick = () => {
          if (!track.unlocked) return;
          selectedTrack = track;
          document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };
        tracksGrid.appendChild(card);
      });

      const garageGrid = document.getElementById('garage-grid');
      garageGrid.innerHTML = '';
      CARS.forEach(car => {
        const card = document.createElement('div');
        card.className = `car-card ${car.id === selectedCar.id ? 'active' : ''}`;
        card.innerHTML = `<div class="car-color-dot" style="background:${car.color};"></div><div style="font-family:'Orbitron'; font-size:0.75rem;">${car.name}</div>`;
        card.onclick = () => {
          selectedCar = car;
          document.querySelectorAll('.car-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };
        garageGrid.appendChild(card);
      });
    }

    function startGame() {
      audio.init();
      resizeCanvas();
      buildTrack(selectedTrack);
      
      position = 0;
      speed = 0;
      playerX = 0;
      nitroAmount = 100;
      timeRemaining = selectedTrack.timeLimit;
      isPlaying = true;

      document.getElementById('menu-overlay').classList.add('hidden');
      document.getElementById('result-overlay').classList.add('hidden');
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('hud-track-name').innerText = selectedTrack.name;
    }

    function gameOver(isWin) {
      isPlaying = false;
      document.getElementById('hud').style.display = 'none';

      const resultTitle = document.getElementById('result-title');
      const resultDesc = document.getElementById('result-desc');

      if (isWin) {
        resultTitle.innerText = "🏆 FASE CONCLUÍDA!";
        resultTitle.style.color = "#ffcc00";
        resultDesc.innerText = `Excelente pilotagem! Próxima fase liberada.`;
        
        const currentIndex = TRACKS.findIndex(t => t.id === selectedTrack.id);
        if (currentIndex < TRACKS.length - 1) {
          TRACKS[currentIndex + 1].unlocked = true;
          saveProgress();
          selectedTrack = TRACKS[currentIndex + 1];
        }
      } else {
        resultTitle.innerText = "⏳ TEMPO ESGOTADO!";
        resultTitle.style.color = "#ff0055";
        resultDesc.innerText = `Sua F1 precisa de mais velocidade. Tente novamente!`;
      }

      document.getElementById('result-overlay').classList.remove('hidden');
    }

    // Ações dos Botões Superiores no HUD
    document.getElementById('btn-cam-top').onclick = () => {
      cameraMode = (cameraMode + 1) % 3;
    };
    document.getElementById('btn-audio-top').onclick = () => {
      const active = audio.toggleMusic();
      document.getElementById('btn-audio-top').innerText = active ? '🎵 MÚSICA' : '🔇 MUTADO';
    };

    document.getElementById('result-btn').onclick = () => {
      document.getElementById('result-overlay').classList.add('hidden');
      document.getElementById('menu-overlay').classList.remove('hidden');
      initUI();
    };

    document.getElementById('start-btn').onclick = startGame;

    // Vinculação de Controles Touch / MOUSE
    const bindControl = (id, key) => {
      const btn = document.getElementById(id);
      const press = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('pressed'); };
      const release = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('pressed'); };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
    };

    bindControl('btn-left', 'left');
    bindControl('btn-right', 'right');
    bindControl('btn-accel', 'accel');
    bindControl('btn-brake', 'brake');
    bindControl('btn-turbo', 'turbo');

    // Suporte ao Teclado no Computador
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w') keys.accel = true;
      if (e.key === 'ArrowDown' || e.key === 's') keys.brake = true;
      if (e.key === ' ') keys.turbo = true;
      if (e.key === 'c' || e.key === 'C') cameraMode = (cameraMode + 1) % 3;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w') keys.accel = false;
      if (e.key === 'ArrowDown' || e.key === 's') keys.brake = false;
      if (e.key === ' ') keys.turbo = false;
    });

    loadSavedProgress();
    initUI();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
