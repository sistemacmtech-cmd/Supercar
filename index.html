<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUPER FORMULA 1 - Mobile Arcade</title>
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050a;
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 5, 12, 0.94);
      z-index: 10;
      transition: opacity 0.3s ease;
      padding: 20px;
      overflow-y: auto;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff0055, #ff5500, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 2px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #00f0ff;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
      text-align: center;
    }
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    
    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 850px;
      margin-bottom: 12px;
    }
    @media (max-width: 850px) {
      .tracks-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 550px) {
      .tracks-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .track-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
      position: relative;
    }
    .track-card.active {
      border-color: #ff0055;
      background: rgba(255, 0, 85, 0.2);
    }
    .track-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .track-icon { font-size: 1.5rem; }
    .track-name { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: #fff; margin-top: 2px; }

    .garage-grid {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 850px;
    }
    .car-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .car-card.active {
      border-color: #ffcc00;
      background: rgba(255, 204, 0, 0.2);
    }
    .car-color-dot { width: 12px; height: 12px; border-radius: 50%; }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 12px 35px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff0055, #ff5500);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-box {
      background: rgba(5, 5, 12, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
    }
    .hud-label { font-size: 0.65rem; color: #00f0ff; letter-spacing: 1px; text-transform: uppercase; }
    .hud-value { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 900; color: #fff; }

    .nitro-container {
      width: 120px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #00f0ff;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 3px;
    }
    .nitro-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #00f0ff, #ff00ff); }

    .speedometer {
      position: absolute;
      top: 65px;
      right: 15px;
      background: rgba(5, 5, 12, 0.85);
      border: 2px solid #ff0055;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
    }
    .speed-val { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; color: #fff; line-height: 0.9; }
    .speed-unit { font-size: 0.5rem; color: #ff0055; letter-spacing: 1px; margin-top: 2px; }

    /* CONTROLES TOUCH AMPLIADOS */
    .touch-controls-left {
      position: absolute;
      bottom: 25px;
      left: 20px;
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }
    .touch-controls-right {
      position: absolute;
      bottom: 25px;
      right: 20px;
      display: flex;
      gap: 12px;
      pointer-events: auto;
      align-items: flex-end;
    }
    .touch-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      border: 3px solid rgba(255, 255, 255, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      color: white;
      touch-action: manipulation;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .touch-btn:active, .touch-btn.pressed {
      background: rgba(0, 240, 255, 0.5);
      border-color: #00f0ff;
      transform: scale(0.95);
    }
    .btn-turbo {
      width: 65px;
      height: 65px;
      background: rgba(255, 0, 85, 0.4);
      border-color: #ff0055;
      font-size: 1rem;
      font-family: 'Orbitron', sans-serif;
    }
    .pedals-group {
      display: flex;
      gap: 12px;
    }
    
    #result-modal {
      text-align: center;
    }
    #result-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="menu-overlay" class="overlay">
      <h1 class="title">SUPER F1</h1>
      <div class="subtitle">Formula 1 Mobile Edition</div>

      <div class="section-title">Fase / Pista</div>
      <div class="tracks-grid" id="tracks-grid"></div>

      <div class="section-title">Equipe / Cor do F1</div>
      <div class="garage-grid" id="garage-grid"></div>

      <button id="start-btn" class="btn">INICIAR CORRIDA</button>
    </div>

    <div id="result-overlay" class="overlay hidden">
      <div id="result-modal">
        <h2 id="result-title"></h2>
        <p id="result-desc" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
        <button id="result-btn" class="btn">CONTINUAR</button>
      </div>
    </div>

    <div id="hud" style="display: none;">
      <div class="hud-top">
        <div class="hud-box">
          <div class="hud-label">Tempo</div>
          <div class="hud-value" id="hud-time">60.0</div>
        </div>
        <div class="hud-box" style="text-align: center;">
          <div class="hud-label" id="hud-track-name">FASE</div>
          <div class="hud-value" id="hud-progress" style="color: #00f0ff; font-size: 1rem;">0%</div>
          <div class="nitro-container"><div class="nitro-bar" id="nitro-bar"></div></div>
        </div>
        <div class="hud-box" style="text-align: right;">
          <div class="hud-label">Pontos</div>
          <div class="hud-value" id="hud-score">0</div>
        </div>
      </div>

      <div class="speedometer">
        <div class="speed-val" id="hud-speed">0</div>
        <div class="speed-unit">KM/H</div>
      </div>

      <!-- CONTROLES DE DIREÇÃO -->
      <div class="touch-controls-left">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>

      <!-- ACELERADOR, FREIO E TURBO -->
      <div class="touch-controls-right">
        <div class="touch-btn btn-turbo" id="btn-turbo">⚡</div>
        <div class="pedals-group">
          <div class="touch-btn" id="btn-brake" style="background: rgba(255,0,50,0.3); border-color: #ff3333;">▼</div>
          <div class="touch-btn" id="btn-accel" style="background: rgba(0,255,100,0.3); border-color: #00ff66;">▲</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TRACKS = [
      { id: 'synthwave', name: 'Synthwave', icon: '🌃', unlocked: true, length: 900, timeLimit: 55, skyGradient: ['#0d0221', '#ff0055'], groundColor: '#0a0a16', grassColors: ['#120826', '#1a0b36'], rumbleColors: ['#ff0055', '#00f0ff'], roadColor: '#181828', lineColor: '#fff' },
      { id: 'desert', name: 'Desert', icon: '🏜️', unlocked: false, length: 1100, timeLimit: 50, skyGradient: ['#2b0400', '#ff7700'], groundColor: '#4a1500', grassColors: ['#cc5200', '#b34700'], rumbleColors: ['#fff', '#ff3300'], roadColor: '#332218', lineColor: '#ffcc00' },
      { id: 'snow', name: 'Snow', icon: '🏔️', unlocked: false, length: 1200, timeLimit: 48, skyGradient: ['#021029', '#00ffcc'], groundColor: '#dbeeff', grassColors: ['#a6d2ed', '#8cbcdb'], rumbleColors: ['#0088ff', '#fff'], roadColor: '#2c3540', lineColor: '#fff' },
      { id: 'tropical', name: 'Tropical', icon: '🌅', unlocked: false, length: 1300, timeLimit: 45, skyGradient: ['#1c002b', '#ffcc00'], groundColor: '#2b1a09', grassColors: ['#0d5e3a', '#08472b'], rumbleColors: ['#ffcc00', '#fff'], roadColor: '#242424', lineColor: '#fff' },
      { id: 'cyber', name: 'Cyber', icon: '⚡', unlocked: false, length: 1400, timeLimit: 42, skyGradient: ['#000000', '#006466'], groundColor: '#020b14', grassColors: ['#003554', '#051923'], rumbleColors: ['#00ffcc', '#ff00ff'], roadColor: '#0a1118', lineColor: '#00ffcc' }
    ];

    const CARS = [
      { id: 'redbull', name: 'Red Bull F1', color: '#121f45', accent: '#ff1801', maxSpeed: 380, accel: 0.40, handling: 0.005 },
      { id: 'ferrari', name: 'Scuderia F1', color: '#dc0000', accent: '#fff', maxSpeed: 375, accel: 0.38, handling: 0.005 },
      { id: 'mercedes', name: 'Mercedes F1', color: '#00d2be', accent: '#000', maxSpeed: 370, accel: 0.36, handling: 0.005 },
      { id: 'mclaren', name: 'McLaren F1', color: '#ff8700', accent: '#000', maxSpeed: 365, accel: 0.35, handling: 0.005 },
      { id: 'alpine', name: 'Alpine F1', color: '#0090ff', accent: '#ff00ae', maxSpeed: 360, accel: 0.34, handling: 0.005 }
    ];

    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        } catch (e) {}
      }
      playTone(freqStart, freqEnd, duration, type='sine', vol=0.1) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freqStart, this.ctx.currentTime);
          if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + duration);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playCoin() { this.playTone(800, 1400, 0.1, 'sine', 0.12); }
      playCrash() { this.playTone(90, 20, 0.2, 'square', 0.2); }
    }
    const audio = new SoundEngine();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let selectedTrack = TRACKS[0];
    let selectedCar = CARS[0];
    let isPlaying = false;
    let score = 0;
    let timeRemaining = 0;
    let nitroAmount = 100;

    let position = 0;
    let speed = 0;
    let playerX = 0; // Restrito entre -0.80 e 0.80 para não sair da pista
    const segmentLength = 200;
    const cameraDepth = 0.84;
    const roadWidth = 2000;
    const drawDistance = 45;

    let segments = [];
    let carsTraffic = [];
    const keys = { left: false, right: false, accel: false, brake: false, turbo: false };

    function loadSavedProgress() {
      try {
        const saved = localStorage.getItem('super_car_unlocked');
        if (saved) {
          const unlockedIds = JSON.parse(saved);
          TRACKS.forEach(t => { if (unlockedIds.includes(t.id)) t.unlocked = true; });
        }
      } catch(e) {}
    }
    function saveProgress() {
      try {
        const unlockedIds = TRACKS.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('super_car_unlocked', JSON.stringify(unlockedIds));
      } catch(e) {}
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth > 0 ? window.innerWidth : 800;
      canvas.height = window.innerHeight > 0 ? window.innerHeight : 600;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function buildTrack(trackConfig) {
      segments = [];
      const numSegments = trackConfig.length;
      for (let i = 0; i < numSegments; i++) {
        let curve = 0;
        if (i > 60 && i < 180) curve = 2;
        if (i > 240 && i < 380) curve = -2.5;
        if (i > 450 && i < 600) curve = 3;

        let sprite = null;
        if (i % 30 === 0) sprite = { type: 'coin', offset: (Math.random() - 0.5) * 1.0 };
        else if (i % 25 === 0) sprite = { type: 'scenery', offset: Math.random() > 0.5 ? 1.5 : -1.5 };

        segments.push({
          index: i,
          p1: { camera: {}, screen: {} },
          p2: { camera: {}, screen: {} },
          curve: curve,
          color: Math.floor(i / 3) % 2 === 0 ? 'dark' : 'light',
          sprite: sprite
        });
      }

      carsTraffic = [];
      for (let i = 0; i < numSegments / 35; i++) {
        carsTraffic.push({
          offset: (Math.random() - 0.5) * 1.1,
          z: Math.random() * numSegments * segmentLength,
          speed: 100 + Math.random() * 80,
          color: ['#00ff66', '#ff00ff', '#ffff00', '#ffffff', '#00e5ff'][Math.floor(Math.random() * 5)]
        });
      }
    }

    function project(p, cameraX, cameraY, cameraZ, width, height) {
      p.camera.x = -cameraX;
      p.camera.y = -cameraY;
      p.camera.z = cameraZ;
      p.screen.scale = cameraDepth / Math.max(1, cameraZ);
      p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
      p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
      p.screen.w = Math.round(p.screen.scale * roadWidth * width / 2);
    }

    let lastTime = performance.now();

    function update(dt) {
      if (!isPlaying) return;

      timeRemaining -= dt;
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        gameOver(false);
        return;
      }

      let maxSpeedAllowed = selectedCar.maxSpeed;
      let accelMultiplier = 1;

      if (keys.turbo && nitroAmount > 0) {
        maxSpeedAllowed += 80;
        accelMultiplier = 1.9;
        nitroAmount = Math.max(0, nitroAmount - 35 * dt);
      } else {
        nitroAmount = Math.min(100, nitroAmount + 4 * dt);
      }

      if (keys.accel) speed += selectedCar.accel * 400 * accelMultiplier;
      else if (keys.brake) speed -= selectedCar.accel * 550;
      else speed -= 35;

      speed = Math.max(0, Math.min(speed, maxSpeedAllowed));

      const currentSegmentIndex = Math.floor(position / segmentLength) % segments.length;
      const currentSegment = segments[currentSegmentIndex];
      const speedRatio = speed / maxSpeedAllowed;

      // Movimentação lateral controlada (Esquerda, Centro, Direita dentro da pista)
      if (keys.left) playerX -= 2.2 * dt;
      if (keys.right) playerX += 2.2 * dt;

      // Trava estrita para o carro de F1 não sair da pista (-0.80 a 0.80)
      playerX = Math.max(-0.80, Math.min(0.80, playerX));

      position += speed * 14 * dt;
      const trackTotalLength = segments.length * segmentLength;

      if (position >= trackTotalLength) {
        gameOver(true);
        return;
      }

      if (currentSegment.sprite && currentSegment.sprite.type === 'coin') {
        if (Math.abs(playerX - currentSegment.sprite.offset) < 0.40) {
          score += 250;
          nitroAmount = Math.min(100, nitroAmount + 25);
          audio.playCoin();
          currentSegment.sprite = null;
        }
      }

      for (let i = 0; i < carsTraffic.length; i++) {
        const npc = carsTraffic[i];
        npc.z += npc.speed * 10 * dt;
        if (npc.z > trackTotalLength) npc.z -= trackTotalLength;

        if (Math.abs(position - npc.z) < 120 && Math.abs(playerX - npc.offset) < 0.35) {
          speed = 40;
          audio.playCrash();
        }
      }

      document.getElementById('hud-speed').innerText = Math.round(speed);
      document.getElementById('hud-time').innerText = timeRemaining.toFixed(1);
      document.getElementById('hud-score').innerText = score;
      document.getElementById('hud-progress').innerText = Math.round((position / trackTotalLength) * 100) + '%';
      document.getElementById('nitro-bar').style.width = nitroAmount + '%';
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;

      const skyHeight = h * 0.45;
      const skyGrad = ctx.createLinearGradient(0, 0, 0, skyHeight);
      skyGrad.addColorStop(0, selectedTrack.skyGradient[0]);
      skyGrad.addColorStop(1, selectedTrack.skyGradient[selectedTrack.skyGradient.length - 1]);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, skyHeight);

      ctx.fillStyle = selectedTrack.groundColor;
      ctx.fillRect(0, skyHeight, w, h - skyHeight);

      const baseIndex = Math.floor(position / segmentLength) % segments.length;
      let dx = 0;
      const camHeight = 1000;
      const trackTotalLength = segments.length * segmentLength;

      for (let n = 0; n < drawDistance; n++) {
        const seg = segments[(baseIndex + n) % segments.length];
        const looped = seg.index < baseIndex;
        const cameraZ = (position - (looped ? trackTotalLength : 0)) - (seg.index * segmentLength);
        const absCameraZ = Math.abs(cameraZ);

        project(seg.p1, playerX * roadWidth - dx, camHeight, absCameraZ, w, h);
        project(seg.p2, playerX * roadWidth - dx - seg.curve, camHeight, absCameraZ + segmentLength, w, h);

        dx += seg.curve;

        if (seg.p1.screen.y <= seg.p2.screen.y) continue;

        const isDark = seg.color === 'dark';
        ctx.fillStyle = isDark ? selectedTrack.grassColors[0] : selectedTrack.grassColors[1];
        ctx.fillRect(0, seg.p2.screen.y, w, seg.p1.screen.y - seg.p2.screen.y);

        const r1 = seg.p1.screen.w * 0.15;
        const r2 = seg.p2.screen.w * 0.15;
        ctx.fillStyle = isDark ? selectedTrack.rumbleColors[0] : selectedTrack.rumbleColors[1];
        drawPoly(seg.p1.screen.x - seg.p1.screen.w - r1, seg.p1.screen.y, seg.p1.screen.x - seg.p1.screen.w, seg.p1.screen.y, seg.p2.screen.x - seg.p2.screen.w, seg.p2.screen.y, seg.p2.screen.x - seg.p2.screen.w - r2, seg.p2.screen.y);
        drawPoly(seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y, seg.p1.screen.x + seg.p1.screen.w + r1, seg.p1.screen.y, seg.p2.screen.x + seg.p2.screen.w + r2, seg.p2.screen.y, seg.p2.screen.x + seg.p2.screen.w, seg.p2.screen.y);

        ctx.fillStyle = selectedTrack.roadColor;
        drawPoly(seg.p1.screen.x - seg.p1.screen.w, seg.p1.screen.y, seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y, seg.p2.screen.x + seg.p2.screen.w, seg.p2.screen.y, seg.p2.screen.x - seg.p2.screen.w, seg.p2.screen.y);

        if (isDark) {
          ctx.fillStyle = selectedTrack.lineColor;
          const lw1 = seg.p1.screen.w * 0.03;
          const lw2 = seg.p2.screen.w * 0.03;
          drawPoly(seg.p1.screen.x - lw1, seg.p1.screen.y, seg.p1.screen.x + lw1, seg.p1.screen.y, seg.p2.screen.x + lw2, seg.p2.screen.y, seg.p2.screen.x - lw2, seg.p2.screen.y);
        }

        if (seg.sprite) {
          const sx = seg.p1.screen.x + seg.p1.screen.scale * seg.sprite.offset * roadWidth * w / 2;
          const sy = seg.p1.screen.y;
          const size = seg.p1.screen.scale * 1000;

          if (seg.sprite.type === 'coin') {
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(sx, sy - size * 0.3, Math.max(3, size * 0.18), 0, Math.PI * 2);
            ctx.fill();
          } else if (seg.sprite.type === 'scenery') {
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(sx - size * 0.1, sy - size, size * 0.2, size);
          }
        }
      }

      // Renderizar Carros Inimigos na Pista
      for (let i = 0; i < carsTraffic.length; i++) {
        const npc = carsTraffic[i];
        let relZ = npc.z - position;
        if (relZ < 0) relZ += trackTotalLength;

        if (relZ > 0 && relZ < drawDistance * segmentLength) {
          const scale = cameraDepth / relZ;
          const npcX = w / 2 + (scale * (npc.offset - playerX) * roadWidth * w / 2);
          const npcY = h / 2 + (scale * camHeight * h / 2);
          const carW = scale * 75000;
          const carH = scale * 35000;

          if (carW > 2 && carH > 2) {
            ctx.fillStyle = npc.color;
            ctx.fillRect(npcX - carW / 2, npcY - carH, carW, carH);
            // Asas do carro NPC
            ctx.fillStyle = '#111';
            ctx.fillRect(npcX - carW * 0.55, npcY - carH, carW * 1.1, carH * 0.25);
          }
        }
      }

      drawFormula1Car(w / 2, h - 75, selectedCar.color, selectedCar.accent);
    }

    function drawPoly(x1, y1, x2, y2, x3, y3, x4, y4) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.lineTo(x4, y4);
      ctx.closePath();
      ctx.fill();
    }

    // Desenho detalhado de um Carro de Fórmula 1 na visão traseira
    function drawFormula1Car(x, y, color, accent) {
      // Asa Traseira
      ctx.fillStyle = '#111';
      ctx.fillRect(x - 42, y - 48, 84, 10);
      ctx.fillStyle = accent;
      ctx.fillRect(x - 42, y - 48, 84, 3);

      // Rodas Traseiras
      ctx.fillStyle = '#111';
      ctx.fillRect(x - 52, y - 35, 16, 26);
      ctx.fillRect(x + 36, y - 35, 16, 26);

      // Corpo Principal do F1 (Cockpit / Chassi)
      ctx.fillStyle = color;
      ctx.fillRect(x - 22, y - 40, 44, 45);

      // Capacete do Piloto
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.arc(x, y - 28, 7, 0, Math.PI * 2);
      ctx.fill();

      // Pontas Laterais e Bico Aerodinâmico
      ctx.fillStyle = accent;
      ctx.fillRect(x - 32, y - 20, 64, 8);

      // Rodas Dianteiras
      ctx.fillStyle = '#111';
      ctx.fillRect(x - 45, y - 15, 12, 22);
      ctx.fillRect(x + 33, y - 15, 12, 22);
    }

    function gameLoop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;

      if (isPlaying) {
        update(dt);
        render();
      }

      requestAnimationFrame(gameLoop);
    }

    function initUI() {
      const tracksGrid = document.getElementById('tracks-grid');
      tracksGrid.innerHTML = '';
      TRACKS.forEach(track => {
        const card = document.createElement('div');
        card.className = `track-card ${track.id === selectedTrack.id ? 'active' : ''} ${!track.unlocked ? 'locked' : ''}`;
        card.innerHTML = `<div class="track-icon">${track.unlocked ? track.icon : '🔒'}</div><div class="track-name">${track.name}</div>`;
        card.onclick = () => {
          if (!track.unlocked) return;
          selectedTrack = track;
          document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };
        tracksGrid.appendChild(card);
      });

      const garageGrid = document.getElementById('garage-grid');
      garageGrid.innerHTML = '';
      CARS.forEach(car => {
        const card = document.createElement('div');
        card.className = `car-card ${car.id === selectedCar.id ? 'active' : ''}`;
        card.innerHTML = `<div class="car-color-dot" style="background:${car.color};"></div><div style="font-family:'Orbitron'; font-size:0.75rem;">${car.name}</div>`;
        card.onclick = () => {
          selectedCar = car;
          document.querySelectorAll('.car-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };
        garageGrid.appendChild(card);
      });
    }

    function startGame() {
      audio.init();
      resizeCanvas();
      buildTrack(selectedTrack);
      
      position = 0;
      speed = 0;
      playerX = 0; // Começa centralizado
      score = 0;
      nitroAmount = 100;
      timeRemaining = selectedTrack.timeLimit;
      isPlaying = true;

      document.getElementById('menu-overlay').classList.add('hidden');
      document.getElementById('result-overlay').classList.add('hidden');
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('hud-track-name').innerText = selectedTrack.name;
    }

    function gameOver(isWin) {
      isPlaying = false;
      document.getElementById('hud').style.display = 'none';

      const resultTitle = document.getElementById('result-title');
      const resultDesc = document.getElementById('result-desc');

      if (isWin) {
        resultTitle.innerText = "🏆 VITÓRIA NA F1!";
        resultTitle.style.color = "#00f0ff";
        resultDesc.innerText = `Pontuação Total: ${score}`;
        
        const currentIndex = TRACKS.findIndex(t => t.id === selectedTrack.id);
        if (currentIndex < TRACKS.length - 1) {
          TRACKS[currentIndex + 1].unlocked = true;
          saveProgress();
        }
      } else {
        resultTitle.innerText = "💥 TEMPO ESGOTADO!";
        resultTitle.style.color = "#ff0055";
        resultDesc.innerText = "Você não conseguiu cruzar a linha de chegada a tempo.";
      }

      document.getElementById('result-overlay').classList.remove('hidden');
    }

    document.getElementById('result-btn').onclick = () => {
      document.getElementById('result-overlay').classList.add('hidden');
      document.getElementById('menu-overlay').classList.remove('hidden');
      initUI();
    };

    document.getElementById('start-btn').onclick = startGame;

    const bindControl = (id, key) => {
      const btn = document.getElementById(id);
      const press = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('pressed'); };
      const release = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('pressed'); };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
    };

    bindControl('btn-left', 'left');
    bindControl('btn-right', 'right');
    bindControl('btn-accel', 'accel');
    bindControl('btn-brake', 'brake');
    bindControl('btn-turbo', 'turbo');

    loadSavedProgress();
    initUI();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
